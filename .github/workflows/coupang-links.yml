name: 쿠팡 링크·상품 생성

# 손으로 돌린다. 재료가 늘었거나 링크를 새로 받고 싶을 때 Actions 탭에서 실행.
on:
  workflow_dispatch:
    inputs:
      sub_id:
        description: '하위 채널 구분자 (선택, 비워도 됨)'
        required: false
        default: ''
      products:
        description: '상품 정보까지 새로 받기 (가격이 바뀌므로 가끔만)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write     # 생성 결과를 커밋
  pages: write        # 바로 배포까지
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # rebase 가 가능하도록 전체 히스토리를 받는다 (얕은 클론이면 재시도가 막힌다)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 비밀키는 러너 안에서만 환경변수로 쓰인다. 배포되는 파일에는 들어가지 않는다.
      - name: 딥링크 생성
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ inputs.sub_id }}
        run: node tools/gen-coupang-links.js

      # 상품검색은 재료당 1회라 딥링크보다 오래 걸린다 (약 3분)
      - name: 상품 정보 생성
        if: ${{ inputs.products }}
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node tools/gen-coupang-products.js

      - name: 바뀐 게 있으면 커밋
        run: |
          set -euo pipefail
          if git diff --quiet -- data/coupang-links.js data/coupang-products.js; then
            echo "링크에 변경이 없습니다. 배포만 다시 합니다."
            exit 0
          fi

          # 캐시 버전을 올려야 이미 방문한 사람에게 새 링크가 전달된다
          cur=$(sed -n "s/.*fridge-recipe-v\([0-9]\+\).*/\1/p" sw.js | head -1)
          next=$((cur + 1))
          sed -i "s/fridge-recipe-v$cur/fridge-recipe-v$next/" sw.js
          echo "서비스워커 캐시 v$cur → v$next"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/coupang-links.js data/coupang-products.js sw.js
          git commit -m "쿠팡 딥링크 갱신 (자동 생성)"

          # 이 워크플로가 두 번 겹쳐 돌면 나중 것이 'fetch first' 로 거부된다.
          # 원격을 가져와 붙인 뒤 다시 민다.
          for try in 1 2 3; do
            if git push origin HEAD:main; then
              echo "푸시 성공"
              exit 0
            fi
            echo "푸시 거부됨 — 원격을 가져와 재시도 ($try/3)"
            git pull --rebase origin main
          done
          echo "3번 시도 후에도 푸시하지 못했습니다."
          exit 1

      # 워크플로가 푸시한 커밋은 다른 워크플로를 트리거하지 않는다.
      # 그래서 Pages 배포를 이 잡 안에서 직접 한다. 방금 만든 파일이 그대로 올라간다.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
