name: 쿠팡 딥링크 생성

# 손으로 돌린다. 재료가 늘었거나 링크를 새로 받고 싶을 때 Actions 탭에서 실행.
on:
  workflow_dispatch:
    inputs:
      sub_id:
        description: '하위 채널 구분자 (선택, 비워도 됨)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 비밀키는 러너 안에서만 환경변수로 쓰인다. 배포되는 파일에는 들어가지 않는다.
      - name: 딥링크 생성
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ inputs.sub_id }}
        run: node tools/gen-coupang-links.js

      - name: 바뀐 게 있으면 커밋
        run: |
          set -euo pipefail
          if git diff --quiet -- data/coupang-links.js; then
            echo "링크에 변경이 없습니다."
            exit 0
          fi

          # 캐시 버전을 올려야 이미 설치한 사람에게 새 링크가 전달된다
          cur=$(sed -n "s/.*fridge-recipe-v\([0-9]\+\).*/\1/p" sw.js | head -1)
          next=$((cur + 1))
          sed -i "s/fridge-recipe-v$cur/fridge-recipe-v$next/" sw.js
          echo "서비스워커 캐시 v$cur → v$next"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/coupang-links.js sw.js
          git commit -m "쿠팡 딥링크 갱신 (자동 생성)"
          git push
