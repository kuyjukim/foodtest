name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 레시피가 바뀌면 정적 페이지와 sitemap 도 같이 새로 뽑는다
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 레시피 페이지 생성
        run: node tools/gen-pages.js

      # Pages 는 Settings 에서 미리 켜 둬야 한다.
      # (워크플로 토큰에는 Pages 를 생성할 권한이 없다)
      - uses: actions/configure-pages@v5

      # 빌드 과정이 없는 정적 사이트라 파일을 그대로 올린다
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
