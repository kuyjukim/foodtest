<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 뭐 먹지?</title>
<meta name="description" content="집에 있는 재료를 입력하면 지금 만들 수 있는 요리를 찾아줍니다. 레시피 125개, 설치해서 오프라인으로도 볼 수 있습니다.">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘 뭐 먹지">

<meta property="og:type" content="website">
<meta property="og:site_name" content="오늘 뭐 먹지?">
<meta property="og:title" content="오늘 뭐 먹지? — 냉장고 재료로 찾는 레시피">
<meta property="og:description" content="집에 있는 재료를 담으면 지금 만들 수 있는 요리를 찾아줍니다. 레시피 125개, 없는 재료는 대체 재료까지.">
<meta property="og:image" content="https://recipe.eliteaja.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://recipe.eliteaja.com/">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://recipe.eliteaja.com/">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">🍳</span>
    <div>
      <h1>오늘 뭐 먹지?</h1>
      <p>집에 있는 재료를 담으면 지금 만들 수 있는 요리를 찾아줍니다</p>
    </div>
  </div>
  <div class="top-actions">
    <button id="installBtn" class="install-btn" type="button" hidden>앱 설치</button>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="밝은 화면과 어두운 화면 전환">🌙</button>
  </div>
</header>

<main class="layout">
  <aside class="panel">
    <div class="panel-head">
      <h2>내 재료 <span id="pantryCount" class="count">0</span></h2>
      <button id="clearBtn" class="link-btn" type="button" hidden>전체 비우기</button>
    </div>

    <div class="input-wrap">
      <input id="ingInput" type="text" placeholder="재료 이름 입력 (예: 계란)"
             autocomplete="off" aria-label="재료 이름" aria-expanded="false"
             aria-controls="suggest" role="combobox">
      <ul id="suggest" class="suggest" role="listbox" hidden></ul>
    </div>

    <div id="chips" class="chips" aria-live="polite"></div>
    <p id="pantryEmpty" class="muted small">아래 <b>빠르게 담기</b>에서 골라도 됩니다.</p>

    <details class="group">
      <summary>기본 양념 <span class="hint">집에 있다고 가정</span></summary>
      <p class="muted small">없는 양념은 체크를 해제하세요. 해제하면 그 양념이 필요한 요리는 ‘재료 부족’으로 표시됩니다.</p>
      <div id="staples" class="staple-list"></div>
    </details>

    <details class="group" open>
      <summary>빠르게 담기</summary>
      <div id="quickPick" class="quick"></div>
    </details>
  </aside>

  <section class="results">
    <div class="toolbar">
      <input id="searchInput" class="search" type="search" placeholder="요리 이름 검색" aria-label="요리 이름 검색">
      <div class="selects">
        <label>종류
          <select id="kindSel">
            <option value="">전체</option>
          </select>
        </label>
        <label>시간
          <select id="timeSel">
            <option value="">전체</option>
            <option value="15">15분 이내</option>
            <option value="25">25분 이내</option>
            <option value="40">40분 이내</option>
          </select>
        </label>
        <label>정렬
          <select id="sortSel">
            <option value="match">추천순</option>
            <option value="time">조리시간 짧은순</option>
            <option value="few">재료 적은순</option>
            <option value="name">이름순</option>
          </select>
        </label>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="makeableOnly"> 지금 만들 수 있는 것만 <span class="hint">(대체 포함)</span></label>
        <label><input type="checkbox" id="vegOnly"> 고기·해산물 없이</label>
      </div>
    </div>

    <p id="summary" class="summary" aria-live="polite"></p>
    <div id="cards" class="cards"></div>
    <p id="noResult" class="empty" hidden></p>
  </section>
</main>

<footer class="site-foot">
  <p id="disclosure" class="disclosure" hidden></p>
</footer>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-box">
    <button class="modal-close" type="button" data-close aria-label="닫기">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalTabs" class="tabs" hidden></div>
    <div id="modalMeta" class="meta-row"></div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="data/affiliate.js"></script>
<script src="data/coupang-links.js"></script>
<script src="data/ingredients.js"></script>
<script src="data/recipes.js"></script>
<script src="app.js"></script>
</body>
</html>
